    <meta name="theme-color" content="#15120e" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var STORAGE_KEY = 'portfolio-theme'
        var DARK = 'dark'
        var LIGHT = 'light'
        var stored = null
        try {
          stored = localStorage.getItem(STORAGE_KEY)
        } catch (error) {
          stored = null
        }
        if (stored !== DARK && stored !== LIGHT) {
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          stored = prefersLight ? LIGHT : DARK
        }
        document.documentElement.setAttribute('data-theme', stored)

        var BAR_COLORS = { dark: '#15120e', light: '#faf7f2' }
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar) bar.setAttribute('content', BAR_COLORS[stored])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
